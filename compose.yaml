services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_dwh
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retail_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_dwh"]
      interval: 5s
      retries: 10
volumes:
  retail_pg:
